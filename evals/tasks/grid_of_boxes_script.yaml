id: grid_of_boxes_script
title: "Grid of boxes by script"
profile: full
timeout_s: 300
fixture: fixtures/empty.jas
tags: ["script", "modeling"]
prompt: "Use a script to create a 4 x 4 grid of small boxes spaced 1 unit apart, all named \"Cell\", grouped in a folder \"Grid\". Lint before running."
assertions:
  - {"type": "object_exists", "name_regex": "^Cell$", "object_type": "BOX", "min_count": 16}
  - {"type": "parent_of", "child_regex": "^Cell$", "parent_regex": "^Grid$"}
  - {"type": "tool_called", "tool": "c3d_lint_script"}
